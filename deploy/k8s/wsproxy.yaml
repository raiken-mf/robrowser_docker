apiVersion: apps/v1
kind: Deployment
metadata:
  name: wsproxy
  namespace: ragnarok
  labels:
    app.kubernetes.io/name: wsproxy
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: wsproxy
  template:
    metadata:
      labels:
        app.kubernetes.io/name: wsproxy
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: wsproxy
          image: ghcr.io/raiken-mf/wsproxy:stable
          # stable intentionally follows the current main image on each rollout.
          imagePullPolicy: Always
          # Match the Compose allow-list: only proxy to this stack's internal game services.
          args: ["-a", "ragnarok-login:6900,ragnarok-char:6121,ragnarok-map:5121"]
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          env:
            - name: PORT
              value: "5999"
          ports:
            - containerPort: 5999
              name: wsproxy
          readinessProbe:
            tcpSocket:
              port: wsproxy
            initialDelaySeconds: 2
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 6
          livenessProbe:
            tcpSocket:
              port: wsproxy
            initialDelaySeconds: 10
            periodSeconds: 15
            timeoutSeconds: 2
            failureThreshold: 3
          resources:
            requests:
              cpu: 25m
              memory: 32Mi
            limits:
              cpu: 250m
              memory: 128Mi
---
apiVersion: v1
kind: Service
metadata:
  name: wsproxy
  namespace: ragnarok
  labels:
    app.kubernetes.io/name: wsproxy
spec:
  type: NodePort
  selector:
    app.kubernetes.io/name: wsproxy
  ports:
    - name: wsproxy
      port: 5999
      targetPort: 5999
      nodePort: 30599
