apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: ragnarok-stack
  namespace: flux-system
spec:
  # Ragnarok has been removed and must not be reconciled automatically.
  suspend: true
  interval: 10m0s
  path: ./deploy/overlays/flux
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  timeout: 10m0s
  wait: false
