name: CI

on:
  pull_request:
  push:
    branches: [main]
    paths-ignore:
      - '.gitignore'
      - 'README.md'
      - 'docs/**'

# Called workflows inherit no more than these job-specific permissions.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: false
  queue: max

jobs:
  pr-image-security:
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
    uses: ./.github/workflows/pr-image-security.yml

  validate:
    needs: pr-image-security
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: read
    steps:
      - name: Require PR image security
        env:
          EVENT_NAME: ${{ github.event_name }}
          SCAN_RESULT: ${{ needs.pr-image-security.result }}
        run: test "$EVENT_NAME" != pull_request || test "$SCAN_RESULT" = success

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Test XERJ reference monitor
        run: python3 scripts/py/check-xerj-monitor.py

      - name: Validate repository script layout
        run: python3 scripts/py/check-script-layout.py

      - name: Install YAML test dependency
        run: python3 -m pip install --user 'PyYAML==6.0.2'

      - name: Test CI and Dockerfile contracts
        run: python3 scripts/py/check-dockerfile-configs.py

      - name: Determine scope
        id: scope
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "$BASE_SHA" ] || ! git cat-file -e "$BASE_SHA^{commit}" 2>/dev/null; then
            echo 'relevant=true' >> "$GITHUB_OUTPUT"
            echo 'build=true' >> "$GITHUB_OUTPUT"
            echo 'rathena=true' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "$GITHUB_EVENT_NAME" = pull_request ]; then
            comparison="$BASE_SHA...$HEAD_SHA"
          else
            comparison="$BASE_SHA..$HEAD_SHA"
          fi
          changed=$(git diff --name-only "$comparison")
          if grep -Eq '^(images/|build/|\.github/workflows/|deploy/|scripts/|Dockerfile$|\.dockerignore$)' <<< "$changed"; then
            echo 'relevant=true' >> "$GITHUB_OUTPUT"
          else
            echo 'relevant=false' >> "$GITHUB_OUTPUT"
          fi
          if grep -Ev '^(deploy/clusters/|deploy/k8s/overlays/flux/|docs/|README\.md$|\.gitignore$)' <<< "$changed" | grep -Eq '^(images/|build/|\.github/workflows/|deploy/|scripts/py/check-(compose|image-overrides)\.py$|scripts/sh/ci/check-image-boundaries\.sh$|Dockerfile$|\.dockerignore$)'; then
            echo 'build=true' >> "$GITHUB_OUTPUT"
          else
            echo 'build=false' >> "$GITHUB_OUTPUT"
          fi
          if grep -Eq '^(images/rathena/|scripts/sh/ci/check-rathena-pin-scope\.sh$)' <<< "$changed" || ! bash scripts/sh/ci/check-rathena-pin-scope.sh "$comparison"; then
            echo 'rathena=true' >> "$GITHUB_OUTPUT"
          else
            echo 'rathena=false' >> "$GITHUB_OUTPUT"
          fi

      - name: Validate pinned source layouts
        if: steps.scope.outputs.relevant == 'true'
        run: |
          bash scripts/sh/ci/check-upstream-layout.sh

      - name: Validate Kustomize manifests
        if: steps.scope.outputs.relevant == 'true'
        run: |
          bash scripts/sh/ci/check-platform-config.sh

      - name: Render configurable Kubernetes web manifests
        if: steps.scope.outputs.relevant == 'true'
        run: |
          ENV_FILE=.env-tmpl bash scripts/sh/k8s/k8s-render-web-manifests.sh "$RUNNER_TEMP/web-manifests"
          if grep -R -F "\${" "$RUNNER_TEMP/web-manifests"; then
            echo 'Unresolved Kubernetes template variables' >&2
            exit 1
          fi

      - name: Validate private offline Kubernetes bootstrap
        if: steps.scope.outputs.relevant == 'true'
        run: |
          bash scripts/sh/ci/check-k8s-setup.sh
          python3 scripts/py/check-k8s-bootstrap.py
          python3 scripts/py/check-k8s-all.py

      - name: Validate Docker Compose
        if: steps.scope.outputs.relevant == 'true'
        shell: bash
        run: |
          python3 scripts/py/check-compose-contract.py
          cp .env-tmpl .env
          set -a
          source .env
          source build/dependencies.env
          set +a
          docker compose -f deploy/compose/docker-compose-common.yml -f deploy/compose/docker-compose-rathena.yml config --quiet
          docker compose -f deploy/compose/docker-compose-common.yml -f deploy/compose/docker-compose-hercules.yml config --quiet

      - name: Set up Docker Buildx
        if: steps.scope.outputs.build == 'true'
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v3.11.1

      - name: Load pinned source revisions
        if: steps.scope.outputs.build == 'true' || steps.scope.outputs.rathena == 'true'
        run: grep -E '^[A-Z0-9_]+=' build/dependencies.env >> "$GITHUB_ENV"

      - name: Build RemoteClient for smoke test
        if: steps.scope.outputs.build == 'true'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v6.18.0
        with:
          context: .
          file: images/remote/Dockerfile
          load: true
          tags: remote:ci
          cache-from: type=gha,scope=ci-remote-amd64
          cache-to: type=gha,scope=ci-remote-amd64,mode=max,ignore-error=true
          build-args: |
            REMOTECLIENT_REPOSITORY=${{ env.REMOTECLIENT_REPOSITORY }}
            REMOTECLIENT_REF=${{ env.REMOTECLIENT_REF }}
            ROENGLISH_REPOSITORY=${{ env.ROENGLISH_REPOSITORY }}
            ROENGLISH_REF=${{ env.ROENGLISH_REF }}

      - name: Build roBrowser frontend for smoke test
        if: steps.scope.outputs.build == 'true'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v6.18.0
        with:
          context: .
          file: images/robrowser/Dockerfile
          load: true
          tags: robrowser:ci
          cache-from: type=gha,scope=ci-robrowser-amd64
          cache-to: type=gha,scope=ci-robrowser-amd64,mode=max,ignore-error=true
          build-args: |
            ROBROWSER_REPOSITORY=${{ env.ROBROWSER_REPOSITORY }}
            ROBROWSER_REF=${{ env.ROBROWSER_REF }}

      - name: Test roBrowser Lua module loader and cursor
        if: steps.scope.outputs.build == 'true'
        run: |
          docker run --rm --entrypoint sh \
            --mount "type=bind,src=$GITHUB_WORKSPACE/images/robrowser/tests/normalize-cursor-test.cjs,dst=/tmp/normalize-cursor-test.cjs,readonly" \
            robrowser:ci -c '
              set -eu
              npm install --prefix /tmp/test-tools --no-save --ignore-scripts vitest-canvas-mock@1.2.0
              ln -s /tmp/test-tools/node_modules/vitest-canvas-mock node_modules/vitest-canvas-mock
              node /tmp/normalize-cursor-test.cjs
              npm test -- --globals tests/core/LuaModuleLoader.test.js tests/ui/CursorManager.test.js
            '

      - name: Regress cache-busted iframe HTML and Vite module handshake
        if: steps.scope.outputs.build == 'true'
        run: python3 images/robrowser/tests/check-api-module.py robrowser:ci

      - name: Run ROEnglish generator fixtures
        if: steps.scope.outputs.build == 'true'
        run: |
          docker run --rm --entrypoint php \
            --mount "type=bind,src=$GITHUB_WORKSPACE,dst=/repo,readonly" \
            remote:ci /repo/images/remote/tests/check-roenglish-generator.php

      - name: Verify generated Renewal and Pre-Renewal translations
        if: steps.scope.outputs.build == 'true'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y lua5.1
          bash images/remote/tests/check-roenglish.sh

      - name: Smoke-test runtime generation and HTTP via isolated Compose web services
        if: steps.scope.outputs.build == 'true'
        run: python3 scripts/py/check-compose.py

      - name: Verify image filesystem boundaries
        if: steps.scope.outputs.build == 'true'
        run: bash scripts/sh/ci/check-image-boundaries.sh remote:ci robrowser:ci

      - name: Verify independent image overrides
        if: steps.scope.outputs.build == 'true'
        env:
          OVERRIDE_BUILDX: "1"
        run: python3 scripts/py/check-image-overrides.py

      - name: Smoke-test roBrowser
        if: steps.scope.outputs.build == 'true'
        shell: bash
        run: |
          set -euo pipefail
          docker run -d --name remote-ci \
            -e ROBROWSER_ROLE=web -e PACKETVER=20211103 -e ROENGLISH_LEGACY_MAPS=0 \
            -e HOST=ro.example.test -e PORT_HTTP=30080 -e PORT_WSPROXY=30599 \
            -p 8080:8080 remote:ci
          docker run -d --name robrowser-ci \
            -e ROBROWSER_ROLE=vite \
            -e HOST=ro.example.test -e PORT_HTTP=30080 -e PORT_WSPROXY=30599 \
            -p 3000:3000 robrowser:ci
          wait_http() {
            local url="$1" count
            for ((count=1; count<=30; count++)); do
              if curl -fsS "$url" >/dev/null 2>&1; then return 0; fi
              sleep 2
            done
            echo "Timed out: $url" >&2
            return 1
          }
          wait_http http://127.0.0.1:8080/
          wait_http http://127.0.0.1:3000/
          curl -fsS -H 'Host: ro.example.test' http://127.0.0.1:3000/@vite/client >/dev/null
          docker cp images/remote/tests/check-php.php remote-ci:/var/www/localhost/htdocs/ci-php-check.php
          curl -fsS http://127.0.0.1:8080/ci-php-check.php | \
            grep -Ex 'PHP runtime security check passed \(8\.4\.[0-9]+, apache2handler\)'
          docker exec remote-ci rm /var/www/localhost/htdocs/ci-php-check.php
          docker exec remote-ci test -f /var/www/localhost/htdocs/remote/.htaccess
          curl -fsS http://127.0.0.1:8080/ | grep -Fq "RemoteClient service"
          curl -fsS http://127.0.0.1:3000/ -o /tmp/remote-index.html
          grep -Fq 'remoteClient:  window.location.origin + "/remote/"' /tmp/remote-index.html
          grep -Fq 'address:     "ragnarok-login"' /tmp/remote-index.html
          grep -Fq 'socketProxy: "ws://ro.example.test:30599/"' /tmp/remote-index.html
          url='http://127.0.0.1:3000/src/Renderer/GR2/GR2ModelRenderer.js'
          status=''
          for ((count=1; count<=30; count++)); do
            status=$(curl -sS -o /tmp/gr2-module.js -w '%{http_code}' "$url" || true)
            if [ "$status" = '200' ] && grep -q 'granny-ro-js_wasm' /tmp/gr2-module.js; then break; fi
            sleep 2
          done
          test "$status" = '200'
          grep -q 'granny-ro-js_wasm' /tmp/gr2-module.js
          grep -q 'parseAnimated' /tmp/gr2-module.js
          grep -q 'poseAt' /tmp/gr2-module.js
          ! grep -q 'Failed to resolve import' /tmp/gr2-module.js

      - name: roBrowser diagnostics
        if: always() && steps.scope.outputs.build == 'true'
        run: |
          docker logs remote-ci || true
          docker logs robrowser-ci || true
      - name: Remove roBrowser container
        if: always() && steps.scope.outputs.build == 'true'
        run: |
          docker rm -f remote-ci || true
          docker rm -f robrowser-ci || true

      - name: Build rAthena on AMD64 (PR validation)
        if: steps.scope.outputs.rathena == 'true'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v6.18.0
        with:
          context: ./images/rathena
          platforms: linux/amd64
          push: false
          load: true
          tags: rathena:ci
          cache-from: type=gha,scope=ci-rathena-amd64
          cache-to: type=gha,scope=ci-rathena-amd64,mode=max,ignore-error=true
          build-args: |
            RATHENA_REPOSITORY=${{ env.RATHENA_REPOSITORY }}
            RATHENA_REF=${{ env.RATHENA_REF }}

      - name: Test rAthena entrypoint
        if: steps.scope.outputs.rathena == 'true'
        run: bash images/rathena/tests/check-entrypoint.sh

      - name: Build wsProxy
        if: steps.scope.outputs.build == 'true'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v6.18.0
        with:
          context: ./images/wsproxy
          load: true
          tags: wsproxy:ci
          cache-from: type=gha,scope=ci-wsproxy-amd64
          cache-to: type=gha,scope=ci-wsproxy-amd64,mode=max,ignore-error=true
      - name: Smoke-test wsProxy
        if: steps.scope.outputs.build == 'true'
        run: |
          docker run -d --name wsproxy-ci -p 5999:5999 wsproxy:ci -a ragnarok-login:6900
          docker exec -i wsproxy-ci node - < images/wsproxy/tests/check-wsproxy.cjs
      - name: wsProxy diagnostics
        if: always() && steps.scope.outputs.build == 'true'
        run: docker logs wsproxy-ci || true
      - name: Remove wsProxy container
        if: always() && steps.scope.outputs.build == 'true'
        run: docker rm -f wsproxy-ci || true

  security:
    if: always() && github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.validate.result == 'success'
    needs: validate
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/security.yml

  publish:
    if: always() && github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.validate.result == 'success' && needs.security.result == 'success'
    needs: [validate, security]
    permissions:
      actions: read
      contents: write
      packages: write
      pull-requests: write
    uses: ./.github/workflows/publish.yml
