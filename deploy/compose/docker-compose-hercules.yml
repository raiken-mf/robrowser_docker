x-game-environment: &game-environment
  MARIADB_HOST: ${MARIADB_HOST:-database}
  MARIADB_DATABASE: ${MARIADB_DATABASE:-ragnarok}
  MARIADB_USER: ${MARIADB_USER:-ragnarok}
  MARIADB_PASSWORD: ${MARIADB_PASSWORD:-}
  SET_INTERSRV_USER: ${SET_INTERSRV_USER:-s1}
  SET_INTERSRV_PASSWORD: ${SET_INTERSRV_PASSWORD:-}
  SET_MOTD: ${SET_MOTD:-Welcome}
  SET_PRERENEWAL: ${SET_PRERENEWAL:-0}

services:
  hercules:
    container_name: "hercules"
    image: hercules
    pull_policy: never
    volumes:
      - ../../images/hercules/repository_override:/opt/repository_override
    build:
      context: ../../images/hercules
      args:
          PACKETVER: ${PACKETVER}
          SET_PRERENEWAL: ${SET_PRERENEWAL}
          HERCULES_REPOSITORY: ${HERCULES_REPOSITORY:-https://github.com/raiken-mf/Hercules.git}
          HERCULES_REF: ${HERCULES_REF:-1d07ca6a2b57fbd68c973b5224e4efcb7589818b}
          PACKET_OBFUSCATION_KEY1: ${PACKET_OBFUSCATION_KEY1}
          PACKET_OBFUSCATION_KEY2: ${PACKET_OBFUSCATION_KEY2}
          PACKET_OBFUSCATION_KEY3: ${PACKET_OBFUSCATION_KEY3}
    command: ["/bin/true"]
    environment:
      <<: *game-environment
      INIT_DB: "true"
    depends_on:
      database:
        condition: service_healthy
    networks:
      - backend

  ragnarok-login:
    container_name: "ragnarok-login"
    image: hercules
    restart: always
    pull_policy: never
    user: ragnarok:ragnarok
    environment:
      <<: *game-environment
    #volumes:
    #  - ../../images/hercules/repository:/opt/ragnarok
    command: ["/opt/ragnarok/login-server"]
    tty: true
    depends_on:
      hercules:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "nc", "-z", "127.0.0.1", "6900"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 30s
    ports:
      - 6900:6900
    networks:
      - backend

  ragnarok-char:
    container_name: "ragnarok-char"
    image: hercules
    restart: always
    pull_policy: never
    user: ragnarok:ragnarok
    environment:
      <<: *game-environment
    #volumes:
    #  - ../../images/hercules/repository:/opt/ragnarok
    command: ["/opt/ragnarok/char-server"]
    tty: true
    depends_on:
      ragnarok-login:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "nc", "-z", "127.0.0.1", "6121"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 30s
    ports:
      - 6121:6121
    networks:
      - backend

  ragnarok-map:
    container_name: "ragnarok-map"
    image: hercules
    restart: always
    pull_policy: never
    user: ragnarok:ragnarok
    environment:
      <<: *game-environment
    #volumes:
    #  - ../../images/hercules/repository:/opt/ragnarok
    command: ["/opt/ragnarok/map-server"]
    tty: true
    depends_on:
      ragnarok-char:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "nc", "-z", "127.0.0.1", "5121"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 120s
    ports:
      - 5121:5121
    networks:
      - backend

networks:
  backend:
