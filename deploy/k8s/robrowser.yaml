apiVersion: apps/v1
kind: Deployment
metadata:
  name: robrowser
  namespace: ${NAMESPACE}
  labels:
    app.kubernetes.io/name: robrowser
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: robrowser
  template:
    metadata:
      labels:
        app.kubernetes.io/name: robrowser
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: robrowser
          image: ghcr.io/raiken-mf/robrowser:${ROBROWSER_IMAGE_TAG}
          # stable intentionally follows the current main image on each rollout.
          imagePullPolicy: Always
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          envFrom:
            - configMapRef:
                name: robrowser-config
          ports:
            - containerPort: 3000
              name: frontend
            - containerPort: 8080
              name: apache
          volumeMounts:
            - name: client-data
              mountPath: /opt/client_files
              readOnly: true
          readinessProbe:
            httpGet:
              path: /
              port: apache
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /
              port: apache
            initialDelaySeconds: 20
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 1Gi
      volumes:
        - name: client-data
          persistentVolumeClaim:
            claimName: client-data
---
apiVersion: v1
kind: Service
metadata:
  name: robrowser
  namespace: ${NAMESPACE}
  labels:
    app.kubernetes.io/name: robrowser
spec:
  type: NodePort
  selector:
    app.kubernetes.io/name: robrowser
  ports:
    - name: frontend
      port: 3000
      targetPort: 3000
      nodePort: ${PORT_FRONTEND:-30000}
    - name: apache
      port: 8080
      targetPort: 8080
      nodePort: ${PORT_HTTP:-30080}
