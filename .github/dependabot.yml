version: 2
multi-ecosystem-groups:
  dependencies:
    schedule:
      interval: weekly
      day: monday
      time: "12:00"
      timezone: Europe/Berlin

updates:
  - package-ecosystem: github-actions
    directory: /
    patterns: ["*"]
    multi-ecosystem-group: dependencies
    groups:
      security:
        applies-to: security-updates
        patterns: ["*"]

  - package-ecosystem: docker
    directory: /images/remote
    patterns: ["*"]
    multi-ecosystem-group: dependencies
  - package-ecosystem: docker
    directory: /images/robrowser
    patterns: ["*"]
    multi-ecosystem-group: dependencies
  - package-ecosystem: docker
    directory: /images/rathena
    patterns: ["*"]
    multi-ecosystem-group: dependencies
  - package-ecosystem: docker
    directory: /images/wsproxy
    patterns: ["*"]
    multi-ecosystem-group: dependencies
  - package-ecosystem: docker
    directory: /images/hercules
    patterns: ["*"]
    multi-ecosystem-group: dependencies

  - package-ecosystem: npm
    directory: /images/robrowser
    patterns: ["*"]
    multi-ecosystem-group: dependencies
    groups:
      security:
        applies-to: security-updates
        patterns: ["*"]

  - package-ecosystem: npm
    directory: /images/wsproxy
    patterns: ["*"]
    multi-ecosystem-group: dependencies
    groups:
      security:
        applies-to: security-updates
        patterns: ["*"]
