name: Container Security

# Security scans run only after the build-and-smoke-test CI workflow passed.
on:
  workflow_run:
    workflows: [CI]
    branches: [main]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scan:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: robrowser
            context: .
            file: images/robrowser/Dockerfile
          - name: rathena
            context: ./images/rathena
            file: images/rathena/Dockerfile
          - name: wsproxy
            context: ./images/wsproxy
            file: images/wsproxy/Dockerfile
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4.2.2
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - name: Load pinned source revisions
        run: grep -E '^[A-Z0-9_]+=' build/dependencies.env >> "$GITHUB_ENV"
      - name: Build ${{ matrix.name }} image for scanning
        shell: bash
        run: |
          if [ "${{ matrix.name }}" = robrowser ]; then
            docker build -f "${{ matrix.file }}" \
              --build-arg ROBROWSER_REPOSITORY="$ROBROWSER_REPOSITORY" \
              --build-arg ROBROWSER_REF="$ROBROWSER_REF" \
              --build-arg ROENGLISH_REPOSITORY="$ROENGLISH_REPOSITORY" \
              --build-arg ROENGLISH_REF="$ROENGLISH_REF" \
              -t "${{ matrix.name }}:scan" "${{ matrix.context }}"
          elif [ "${{ matrix.name }}" = rathena ]; then
            docker build -f "${{ matrix.file }}" \
              --build-arg RATHENA_REPOSITORY="$RATHENA_REPOSITORY" \
              --build-arg RATHENA_REF="$RATHENA_REF" \
              -t "${{ matrix.name }}:scan" "${{ matrix.context }}"
          else
            docker build -f "${{ matrix.file }}" -t "${{ matrix.name }}:scan" "${{ matrix.context }}"
          fi
      - name: Scan ${{ matrix.name }} image with Trivy
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ matrix.name }}:scan
          format: sarif
          output: trivy-${{ matrix.name }}.sarif
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'
      - name: Upload ${{ matrix.name }} scan report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: trivy-${{ matrix.name }}
          path: trivy-${{ matrix.name }}.sarif
          if-no-files-found: warn
      - name: Generate ${{ matrix.name }} SBOM
        if: always()
        uses: anchore/sbom-action@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.17.12
        with:
          image: ${{ matrix.name }}:scan
          artifact-name: sbom-${{ matrix.name }}
          format: spdx-json
