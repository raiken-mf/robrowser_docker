# Standard Apache access controls for the unmodified RemoteClient.  Apache
# serves public assets normally; PHP continues to handle upstream 404s.
<Directory "/var/www/localhost/htdocs/remote">
    Options -Indexes
    <FilesMatch "(?i)\.php$">
        Require all denied
    </FilesMatch>
    <Files "index.php">
        Require all granted
    </Files>
</Directory>
# Apache matches the path used by the rewrite, including the current symlink.
<Directory "/opt/remote-runtime/current/loose-System">
    Options FollowSymLinks -Indexes
    AllowOverride None
    Require all granted
</Directory>
<Location "/remote/AI/Util.lua">
    RedirectRelative On
    <If "!-f '/opt/client_files/AI/Util.lua'">
        Redirect 302 /remote/data/ai/util.lua
        Header always set Access-Control-Allow-Origin "*"
    </If>
</Location>
<LocationMatch "(?i)^/remote/(resources|cache|logs|tools)(/|$)">
    Require all denied
</LocationMatch>
# Reject raw traversal or repeated encoding before Apache normalizes the URL.
RewriteEngine On
RewriteCond %{THE_REQUEST} "\s[^\s?]*(\.\.|%2e|%2f|%5c|%25)" [NC]
RewriteRule ^ - [F,L]

# Prefer the same startup snapshot for every spelling of a regular loose file.
RewriteCond /opt/remote-runtime/current/loose-System/PetEvolutionCln.lub -f
RewriteRule ^/remote/System/PetEvolutionCln\.lub$ /opt/remote-runtime/current/loose-System/PetEvolutionCln.lub [L,NC]
RewriteCond /opt/remote-runtime/current/loose-System/CheckAttendance.lub -f
RewriteRule ^/remote/System/CheckAttendance\.lub$ /opt/remote-runtime/current/loose-System/CheckAttendance.lub [L,NC]
RewriteCond /opt/remote-runtime/current/loose-System/PrivateAirplane_True.lub -f
RewriteRule ^/remote/System/PrivateAirplane_True\.lub$ /opt/remote-runtime/current/loose-System/PrivateAirplane_True.lub [L,NC]
RewriteCond /opt/remote-runtime/current/loose-System/PrivateAirplane.lub -f
RewriteRule ^/remote/System/PrivateAirplane\.lub$ /opt/remote-runtime/current/loose-System/PrivateAirplane.lub [L,NC]
# Preserve an exact loose path, including an existing symlink, when there is no snapshot.
RewriteCond %{DOCUMENT_ROOT}%{REQUEST_URI} -f
RewriteRule ^/remote/System/(PetEvolutionCln|CheckAttendance|PrivateAirplane(?:_True)?)\.lub$ - [L,NC]
RewriteRule ^/remote/System/PetEvolutionCln\.lub$ /remote/SystemEN/PetEvolution.lub [PT,L,NC]
RewriteRule ^/remote/System/CheckAttendance\.lub$ /remote/SystemEN/CheckAttendance.lub [PT,L,NC]
RewriteCond /opt/remote-runtime/current/loose-System/PrivateAirplane.lub -f
RewriteRule ^/remote/System/PrivateAirplane_True\.lub$ /opt/remote-runtime/current/loose-System/PrivateAirplane.lub [L,NC]
RewriteRule ^/remote/System/PrivateAirplane_True\.lub$ /remote/SystemEN/PrivateAirplane.lub [PT,L,NC]
RewriteRule ^/remote/System/PrivateAirplane\.lub$ /remote/SystemEN/PrivateAirplane.lub [PT,L,NC]

# Only the application entry point may execute PHP, including in overlays.
<LocationMatch "(?i)^/remote/(?!index\.php$).*\.php$">
    Require all denied
</LocationMatch>
