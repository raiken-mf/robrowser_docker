name: Container Security

on:
  pull_request:
    paths:
      - 'robrowser/**'
      - 'rathena/**'
      - '.dockerignore'
      - '.github/dependencies.env'
      - '.github/workflows/security.yml'
  push:
    branches: [main]
    paths:
      - 'robrowser/**'
      - 'rathena/**'
      - '.dockerignore'
      - '.github/dependencies.env'
      - '.github/workflows/security.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: robrowser
            context: .
            file: robrowser/Dockerfile
          - name: rathena
            context: ./rathena
            file: rathena/Dockerfile
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Load pinned source revisions
        run: grep -E '^[A-Z0-9_]+=' .github/dependencies.env >> "$GITHUB_ENV"
      - name: Build ${{ matrix.name }} image for scanning
        shell: bash
        run: |
          if [ "${{ matrix.name }}" = robrowser ]; then
            docker build -f "${{ matrix.file }}" \
              --build-arg ROBROWSER_REPOSITORY="$ROBROWSER_REPOSITORY" \
              --build-arg ROBROWSER_REF="$ROBROWSER_REF" \
              --build-arg ROENGLISH_REPOSITORY="$ROENGLISH_REPOSITORY" \
              --build-arg ROENGLISH_REF="$ROENGLISH_REF" \
              -t "${{ matrix.name }}:scan" "${{ matrix.context }}"
          else
            docker build -f "${{ matrix.file }}" \
              --build-arg RATHENA_REPOSITORY="$RATHENA_REPOSITORY" \
              --build-arg RATHENA_REF="$RATHENA_REF" \
              -t "${{ matrix.name }}:scan" "${{ matrix.context }}"
          fi
      - name: Scan ${{ matrix.name }} image with Trivy
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ matrix.name }}:scan
          format: sarif
          output: trivy-${{ matrix.name }}.sarif
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'
      - name: Upload ${{ matrix.name }} scan report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: trivy-${{ matrix.name }}
          path: trivy-${{ matrix.name }}.sarif
          if-no-files-found: warn
      - name: Generate ${{ matrix.name }} SBOM
        if: always()
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.17.12
        with:
          image: ${{ matrix.name }}:scan
          artifact-name: sbom-${{ matrix.name }}
          format: spdx-json
