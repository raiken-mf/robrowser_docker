apiVersion: v1
kind: Service
metadata:
  name: ragnarok-login
  namespace: ${NAMESPACE}
  labels:
    app.kubernetes.io/name: ragnarok-login
spec:
  type: ClusterIP
  ports:
    - name: login-port
      port: 6900
      targetPort: 6900
      protocol: TCP
  selector:
    app.kubernetes.io/name: ragnarok-login
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ragnarok-login
  namespace: ${NAMESPACE}
  labels:
    app.kubernetes.io/name: ragnarok-login
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: ragnarok-login
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ragnarok-login
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        - name: wait-for-database
          image: busybox:1.36
          securityContext:
            runAsUser: 1000
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          command: ['sh', '-c', 'until nc -z -v -w3 ${MARIADB_HOST} 3306; do echo "Waiting for Database..."; sleep 2; done;']
      containers:
        - name: login-server
          image: ghcr.io/raiken-mf/rathena:1.0.2-20211103-re
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          command: ["/usr/local/bin/entrypoint.sh"]
          args: ["./login-server"]
          envFrom:
            - secretRef:
                name: mariadb-user-secret
            - configMapRef:
                name: rathena-config
          env:
            - name: INIT_DB
              value: "true"
          ports:
            - containerPort: 6900
              name: login-port
---
