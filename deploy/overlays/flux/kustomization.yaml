apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: ragnarok

resources:
  - ../../k8s

patches:
  - target:
      kind: Namespace
    patch: |-
      - op: replace
        path: /metadata/labels/app.kubernetes.io~1name
        value: ragnarok
  - target:
      kind: NetworkPolicy
      name: allow-db-rathena-only
    patch: |-
      - op: replace
        path: /spec/podSelector/matchLabels/app.kubernetes.io~1name
        value: database
  - target:
      group: k8s.mariadb.com
      kind: MariaDB
    patch: |-
      - op: replace
        path: /metadata/name
        value: database
      - op: replace
        path: /metadata/labels/app.kubernetes.io~1name
        value: database
  - target:
      group: k8s.mariadb.com
      kind: Database
    patch: |-
      - op: replace
        path: /metadata/name
        value: ragnarok
      - op: replace
        path: /spec/mariaDbRef/name
        value: database
  - target:
      group: k8s.mariadb.com
      kind: User
    patch: |-
      - op: replace
        path: /metadata/name
        value: ragnarok
      - op: replace
        path: /spec/mariaDbRef/name
        value: database
  - target:
      group: k8s.mariadb.com
      kind: Grant
    patch: |-
      - op: replace
        path: /metadata/name
        value: ragnarok-grant
      - op: replace
        path: /spec/mariaDbRef/name
        value: database
      - op: replace
        path: /spec/database
        value: ragnarok
      - op: replace
        path: /spec/username
        value: ragnarok
  - target:
      kind: Deployment
      name: ragnarok-login
    patch: |-
      - op: replace
        path: /spec/template/spec/initContainers/0/command/2
        value: 'until nc -z -v -w3 database 3306; do echo "Waiting for Database..."; sleep 2; done;'
  - target:
      kind: Service
      name: robrowser
    patch: |-
      - op: replace
        path: /spec/ports/0/nodePort
        value: 30000
      - op: replace
        path: /spec/ports/1/nodePort
        value: 30080
  - target:
      kind: Service
      name: wsproxy
    patch: |-
      - op: replace
        path: /spec/ports/0/nodePort
        value: 30599

images:
  - name: ghcr.io/raiken-mf/rathena
    newTag: stable # {"$imagepolicy": "flux-system:rathena:tag"}
  - name: ghcr.io/raiken-mf/robrowser
    newTag: stable # {"$imagepolicy": "flux-system:robrowser:tag"}
  - name: ghcr.io/raiken-mf/wsproxy
    newTag: stable # {"$imagepolicy": "flux-system:wsproxy:tag"}
