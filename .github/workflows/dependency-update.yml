name: Check Fork Updates

on:
  workflow_dispatch:
  schedule:
    - cron: '23 12 * * *'

permissions:
  contents: read

concurrency:
  group: upstream-dependency-update
  cancel-in-progress: false

jobs:
  update:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Require PR token
        env:
          TOKEN: ${{ secrets.UPSTREAM_PR_TOKEN }}
        run: |
          if [ -z "$TOKEN" ]; then
            echo "Missing repository secret UPSTREAM_PR_TOKEN. Add a fine-grained token with Contents: Read and write, Pull requests: Read and write." >&2
            exit 1
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          token: ${{ secrets.UPSTREAM_PR_TOKEN }}
          fetch-depth: 0
          ref: ${{ github.event.repository.default_branch }}

      - name: Check dependency cycle
        id: cycle
        env:
          GH_TOKEN: ${{ secrets.UPSTREAM_PR_TOKEN }}
        run: python3 scripts/py/check-fork-update-cycle.py

      - name: Find newer fork heads and update pins
        id: update
        if: steps.cycle.outputs.ready == 'true'
        shell: bash
        run: |
          set -euo pipefail
          source build/dependencies.env
          changed=()
          update_pin() {
            local name="$1" repo="$2" old="$3"
            local head
            head=$(git ls-remote "$repo" HEAD | awk 'NR == 1 {print $1}')
            if [[ ! "$head" =~ ^[0-9a-f]{40}$ ]]; then
              echo "Could not resolve HEAD for $name ($repo)" >&2
              exit 1
            fi
            if [ "$head" != "$old" ]; then
              python3 - "$name" "$head" build/dependencies.env <<'PY'
          import pathlib, re, sys
          key, value, filename = sys.argv[1], sys.argv[2], sys.argv[3]
          path = pathlib.Path(filename)
          text = path.read_text()
          updated, count = re.subn(rf'(?m)^{re.escape(key)}_REF=.*$', f'{key}_REF={value}', text)
          if count != 1:
              raise SystemExit(f'Expected one {key}_REF entry, found {count}')
          path.write_text(updated)
          PY
              changed+=("$name: $old -> $head")
            fi
          }

          update_pin ROBROWSER "$ROBROWSER_REPOSITORY" "$ROBROWSER_REF"
          update_pin REMOTECLIENT "$REMOTECLIENT_REPOSITORY" "$REMOTECLIENT_REF"
          update_pin RATHENA "$RATHENA_REPOSITORY" "$RATHENA_REF"
          update_pin ROENGLISH "$ROENGLISH_REPOSITORY" "$ROENGLISH_REF"

          if [ ${#changed[@]} -eq 0 ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "All four forks are already pinned to their current default-branch heads."
            exit 0
          fi
          {
            echo "changed=true"
            echo 'summary<<EOF'
            printf '%s\n' "${changed[@]}"
            echo EOF
          } >> "$GITHUB_OUTPUT"
          printf 'Detected upstream updates:\n%s\n' "${changed[@]}"

      - name: Validate layouts at candidate revisions
        if: steps.update.outputs.changed == 'true'
        run: chmod +x scripts/sh/ci/check-upstream-layout.sh && scripts/sh/ci/check-upstream-layout.sh

      - name: Create or update dependency update PR
        if: steps.update.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.UPSTREAM_PR_TOKEN }}
          SUMMARY: ${{ steps.update.outputs.summary }}
          REPOSITORY: ${{ github.repository }}
          CYCLE: ${{ steps.cycle.outputs.cycle }}
          PR_NUMBER: ${{ steps.cycle.outputs.pr_number }}
        run: |
          set -euo pipefail
          check_output=$(mktemp)
          trap 'rm -f "$check_output"' EXIT
          GITHUB_OUTPUT="$check_output" python3 scripts/py/check-fork-update-cycle.py
          if ! grep -qx 'ready=true' "$check_output" || ! grep -Fxq "cycle=$CYCLE" "$check_output" || ! grep -Fxq "pr_number=$PR_NUMBER" "$check_output"; then
            echo 'Dependency cycle changed during validation; retry on the next run.'
            exit 0
          fi
          git fetch --quiet origin main
          if [ "$(git rev-parse HEAD)" != "$(git rev-parse FETCH_HEAD)" ]; then
            echo 'Main changed during validation; retry on the next run.'
            exit 0
          fi
          branch='automation/upstream-dependency-update'
          body=$(printf 'Automated upstream fork revision update. CI validates the pinned layouts and builds/smoke-tests the affected images before merge. No automatic merge or deployment is performed.\n\nDetected updates:\n%s\n\n<!-- fork-pin-cycle:%s -->\n' "$SUMMARY" "$CYCLE")
          remote_ref=$(git ls-remote --heads origin "refs/heads/$branch")
          expected_sha=${remote_ref%%[[:space:]]*}
          if [ -n "$expected_sha" ] && ! [[ "$expected_sha" =~ ^[0-9a-f]{40}$ ]]; then
            echo 'Invalid automation branch revision.' >&2
            exit 1
          fi
          if [ -n "$PR_NUMBER" ]; then
            git fetch --quiet origin "refs/heads/$branch:refs/remotes/origin/$branch"
            if [ "$(git rev-parse "refs/remotes/origin/$branch")" != "$expected_sha" ]; then
              echo 'Automation branch changed during validation; retry on the next run.'
              exit 0
            fi
            if git diff --quiet "refs/remotes/origin/$branch" -- build/dependencies.env; then
              gh pr edit "$PR_NUMBER" --repo "$REPOSITORY" --body "$body"
              exit 0
            fi
          fi
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add build/dependencies.env
          git commit -m 'chore(deps): update fork pins'
          git push "--force-with-lease=refs/heads/$branch:$expected_sha" origin "HEAD:refs/heads/$branch"
          if [ -n "$PR_NUMBER" ]; then
            gh pr edit "$PR_NUMBER" --repo "$REPOSITORY" --body "$body"
          else
            gh pr create \
              --repo "$REPOSITORY" \
              --base main \
              --head "$branch" \
              --title 'chore(deps): update fork pins' \
              --body "$body"
          fi
