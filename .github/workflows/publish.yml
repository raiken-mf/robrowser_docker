name: Publish Images

# Only reusable invocation from CI is permitted. No manual security bypass.
on:
  workflow_call:

permissions:
  actions: read
  contents: write
  packages: write
  pull-requests: write

jobs:
  promote-and-update-gitops:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:
      group: promote-main
      cancel-in-progress: false
      queue: max
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4.2.2
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v3.5.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v3.11.1

      - name: Retrieve only security-approved release records
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: ready-*
          path: ready
          merge-multiple: true

      - name: Install YAML contract dependency
        run: python3 -m pip install --user 'PyYAML==6.0.2'

      - name: Reconcile approved releases and the GitOps PR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OWNER: ${{ github.repository_owner }}
        run: python3 scripts/py/publish-images.py
