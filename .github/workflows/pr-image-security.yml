name: PR image security

on:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: pr-image-security-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  scan:
    name: Scan ${{ matrix.image }} (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        image: [remote, robrowser, rathena, hercules, wsproxy]
        arch: [amd64, arm64]
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4.2.2
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Determine affected image
        id: scope
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          IMAGE: ${{ matrix.image }}
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/py/ci-scope.py "$BASE_SHA" "$HEAD_SHA" --pull-request --image "$IMAGE" >> "$GITHUB_OUTPUT"

      - name: Load pinned source revisions
        if: steps.scope.outputs.changed == 'true'
        run: grep -E '^[A-Z0-9_]+=' build/dependencies.env >> "$GITHUB_ENV"

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v3.11.1
        if: steps.scope.outputs.changed == 'true'

      - name: Build PR image
        if: steps.scope.outputs.changed == 'true'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v6.18.0
        with:
          context: ${{ (matrix.image == 'rathena' && './images/rathena') || (matrix.image == 'hercules' && './images/hercules') || (matrix.image == 'wsproxy' && './images/wsproxy') || '.' }}
          file: ${{ (matrix.image == 'remote' && 'images/remote/Dockerfile') || (matrix.image == 'robrowser' && 'images/robrowser/Dockerfile') || '' }}
          platforms: linux/${{ matrix.arch }}
          load: true
          tags: pr-image:scan
          cache-from: type=gha,scope=ci-${{ matrix.image }}-${{ matrix.arch }}
          cache-to: type=gha,scope=ci-${{ matrix.image }}-${{ matrix.arch }},mode=max,ignore-error=true
          build-args: |
            REMOTECLIENT_REPOSITORY=${{ env.REMOTECLIENT_REPOSITORY }}
            REMOTECLIENT_REF=${{ env.REMOTECLIENT_REF }}
            ROENGLISH_REPOSITORY=${{ env.ROENGLISH_REPOSITORY }}
            ROENGLISH_REF=${{ env.ROENGLISH_REF }}
            ROBROWSER_REPOSITORY=${{ env.ROBROWSER_REPOSITORY }}
            ROBROWSER_REF=${{ env.ROBROWSER_REF }}
            RATHENA_REPOSITORY=${{ env.RATHENA_REPOSITORY }}
            RATHENA_REF=${{ env.RATHENA_REF }}
            HERCULES_REPOSITORY=${{ env.HERCULES_REPOSITORY }}
            HERCULES_REF=${{ env.HERCULES_REF }}

      - name: Report HIGH and CRITICAL vulnerabilities and gate on fixable findings
        if: steps.scope.outputs.changed == 'true'
        run: |
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock --entrypoint /bin/sh \
            aquasec/trivy:0.76.1 -ec '
              trivy image --timeout 15m --scanners vuln --severity HIGH,CRITICAL --exit-code 0 --format table pr-image:scan
              trivy image --timeout 15m --skip-db-update --scanners vuln --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1 --format table pr-image:scan
            '

  result:
    name: PR image security
    if: always()
    needs: scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Require all image scans to succeed
        env:
          RESULT: ${{ needs.scan.result }}
        run: test "$RESULT" = success
