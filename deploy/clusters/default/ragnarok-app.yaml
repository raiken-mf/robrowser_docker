apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: ragnarok-stack
  namespace: flux-system
spec:
  # Installation hold: resuming the parent must not start this stack.
  suspend: false
  interval: 10m0s
  path: ./deploy/overlays/flux
  patches:
    - target:
        kind: ConfigMap
        name: robrowser-config
      patch: |-
        - op: replace
          path: /data/HOST
          value: pi
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  timeout: 10m0s
  wait: false
