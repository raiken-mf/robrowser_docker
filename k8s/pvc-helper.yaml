apiVersion: v1
kind: Pod
metadata:
  name: client-data-loader
  namespace: ${NAMESPACE}
  labels:
    app.kubernetes.io/name: client-data-loader
spec:
  securityContext:
    runAsNonRoot: true
    runAsUser: 1000
    runAsGroup: 1000
    fsGroup: 1000
    seccompProfile:
      type: RuntimeDefault
  containers:
    - name: loader
      image: busybox:1.36
      command: ["sh", "-c", "trap : TERM INT; sleep 3600 & wait"]
      securityContext:
        allowPrivilegeEscalation: false
        capabilities:
          drop:
            - ALL
      volumeMounts:
        - name: client-data
          mountPath: /data
  volumes:
    - name: client-data
      persistentVolumeClaim:
        claimName: client-data
  restartPolicy: Never
