apiVersion: k8s.mariadb.com/v1alpha1
kind: MariaDB
metadata:
  name: database
  namespace: ragnarok
  labels:
    app.kubernetes.io/name: database
    app.kubernetes.io/part-of: ragnarok-stack
spec:
  replicas: 1

  galera:
    enabled: false

  image: mariadb:11.8.6
  imagePullPolicy: IfNotPresent

  rootPasswordSecretKeyRef:
    name: mariadb-root-secret
    key: password

  storage:
    size: 5Gi
    storageClassName: longhorn

  myCnf: |
    [mysqld]
    character-set-server=utf8mb4
    collation-server=utf8mb4_unicode_ci
    default-time-zone='+00:00'

  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 1024Mi

  service:
    type: ClusterIP
---
apiVersion: k8s.mariadb.com/v1alpha1
kind: Database
metadata:
  name: ragnarok
  namespace: ragnarok
spec:
  mariaDbRef:
    name: database
  characterSet: utf8mb4
  collate: utf8mb4_unicode_ci
---
apiVersion: k8s.mariadb.com/v1alpha1
kind: User
metadata:
  name: ragnarok
  namespace: ragnarok
spec:
  mariaDbRef:
    name: database
  passwordSecretKeyRef:
    name: mariadb-user-secret
    key: password
  maxUserConnections: 50
---
apiVersion: k8s.mariadb.com/v1alpha1
kind: Grant
metadata:
  name: ragnarok-grant
  namespace: ragnarok
spec:
  mariaDbRef:
    name: database
  privileges:
    - "ALL PRIVILEGES"
  database: "ragnarok"
  table: "*"
  username: "ragnarok"
  grantOption: false
