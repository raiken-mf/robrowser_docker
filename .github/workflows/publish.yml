name: Publish Images

# Publishing starts only after CI for main has completed successfully.
on:
  workflow_run:
    workflows: [CI]
    branches: [main]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  publish:
    # Manual runs stay possible; workflow-triggered runs require a green CI result.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    concurrency:
      group: publish-images-main
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          # workflow_run otherwise checks out the default branch's current HEAD,
          # not necessarily the exact commit CI validated.
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@v3
      - name: Load pinned source revisions
        # GITHUB_ENV accepts only KEY=VALUE lines, not comments.
        run: grep -E '^[A-Z0-9_]+=' .github/dependencies.env >> "$GITHUB_ENV"
      - name: Build and push roBrowser
        uses: docker/build-push-action@v6
        with:
          context: .
          file: robrowser/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/robrowser:sha-${{ github.sha }}
            ghcr.io/${{ github.repository_owner }}/robrowser:stable
          build-args: |
            ROBROWSER_REPOSITORY=${{ env.ROBROWSER_REPOSITORY }}
            ROBROWSER_REF=${{ env.ROBROWSER_REF }}
            ROENGLISH_REPOSITORY=${{ env.ROENGLISH_REPOSITORY }}
            ROENGLISH_REF=${{ env.ROENGLISH_REF }}
      - name: Build and push rAthena
        uses: docker/build-push-action@v6
        with:
          context: ./rathena
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/rathena:sha-${{ github.sha }}
            ghcr.io/${{ github.repository_owner }}/rathena:stable
          build-args: |
            RATHENA_REPOSITORY=${{ env.RATHENA_REPOSITORY }}
            RATHENA_REF=${{ env.RATHENA_REF }}
