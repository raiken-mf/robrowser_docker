name: Publish Images

on:
  workflow_run:
    workflows: [Container Security]
    branches: [main]
    types: [completed]
  workflow_dispatch:
    inputs:
      publish_robrowser:
        description: Publish roBrowser regardless of changed files
        required: true
        default: true
        type: boolean
      publish_rathena:
        description: Publish rAthena regardless of changed files
        required: true
        default: true
        type: boolean
      publish_wsproxy:
        description: Publish wsProxy regardless of changed files
        required: true
        default: true
        type: boolean

permissions:
  contents: write
  packages: write

jobs:
  detect-changes:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    outputs:
      robrowser: ${{ steps.filter.outputs.robrowser }}
      rathena: ${{ steps.filter.outputs.rathena }}
      wsproxy: ${{ steps.filter.outputs.wsproxy }}
      ref: ${{ steps.ref.outputs.ref }}
    steps:
      - name: Resolve security-validated revision
        id: ref
        run: echo "ref=${{ github.event.workflow_run.head_sha || github.sha }}" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2
        with:
          ref: ${{ steps.ref.outputs.ref }}
          fetch-depth: 2
      - name: Detect image-relevant changes
        id: filter
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          FORCE_ROBROWSER: ${{ inputs.publish_robrowser || false }}
          FORCE_RATHENA: ${{ inputs.publish_rathena || false }}
          FORCE_WSPROXY: ${{ inputs.publish_wsproxy || false }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = workflow_dispatch ]; then
            echo "robrowser=$FORCE_ROBROWSER" >> "$GITHUB_OUTPUT"
            echo "rathena=$FORCE_RATHENA" >> "$GITHUB_OUTPUT"
            echo "wsproxy=$FORCE_WSPROXY" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          base=$(git rev-parse HEAD^)
          changed=$(git diff --name-only "$base" HEAD)
          printf 'Changed files:\n%s\n' "$changed"

          if grep -Eq '^(images/robrowser/|\.dockerignore$|build/dependencies\.env$)' <<< "$changed"; then
            echo 'robrowser=true' >> "$GITHUB_OUTPUT"
          else
            echo 'robrowser=false' >> "$GITHUB_OUTPUT"
          fi
          if grep -Eq '^(images/rathena/|build/dependencies\.env$)' <<< "$changed"; then
            echo 'rathena=true' >> "$GITHUB_OUTPUT"
          else
            echo 'rathena=false' >> "$GITHUB_OUTPUT"
          fi
          if grep -Eq '^(images/wsproxy/|\.dockerignore$)' <<< "$changed"; then
            echo 'wsproxy=true' >> "$GITHUB_OUTPUT"
          else
            echo 'wsproxy=false' >> "$GITHUB_OUTPUT"
          fi

  publish-robrowser:
    needs: detect-changes
    if: needs.detect-changes.outputs.robrowser == 'true'
    runs-on: ubuntu-latest
    concurrency:
      group: publish-robrowser-main
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2
        with:
          ref: ${{ needs.detect-changes.outputs.ref }}
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.5.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.11.1
      - name: Load pinned source revisions
        run: grep -E '^[A-Z0-9_]+=' build/dependencies.env >> "$GITHUB_ENV"
      - name: Build and push roBrowser
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.18.0
        with:
          context: .
          file: images/robrowser/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/robrowser:sha-${{ needs.detect-changes.outputs.ref }}
            ghcr.io/${{ github.repository_owner }}/robrowser:stable
          build-args: |
            ROBROWSER_REPOSITORY=${{ env.ROBROWSER_REPOSITORY }}
            ROBROWSER_REF=${{ env.ROBROWSER_REF }}
            ROENGLISH_REPOSITORY=${{ env.ROENGLISH_REPOSITORY }}
            ROENGLISH_REF=${{ env.ROENGLISH_REF }}

  publish-rathena:
    needs: detect-changes
    if: needs.detect-changes.outputs.rathena == 'true'
    runs-on: ubuntu-latest
    concurrency:
      group: publish-rathena-main
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2
        with:
          ref: ${{ needs.detect-changes.outputs.ref }}
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.5.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.11.1
      - name: Load pinned source revisions
        run: grep -E '^[A-Z0-9_]+=' build/dependencies.env >> "$GITHUB_ENV"
      - name: Build and push rAthena
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.18.0
        with:
          context: ./images/rathena
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/rathena:sha-${{ needs.detect-changes.outputs.ref }}
            ghcr.io/${{ github.repository_owner }}/rathena:stable
          build-args: |
            RATHENA_REPOSITORY=${{ env.RATHENA_REPOSITORY }}
            RATHENA_REF=${{ env.RATHENA_REF }}

  publish-wsproxy:
    needs: detect-changes
    if: needs.detect-changes.outputs.wsproxy == 'true'
    runs-on: ubuntu-latest
    concurrency:
      group: publish-wsproxy-main
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2
        with:
          ref: ${{ needs.detect-changes.outputs.ref }}
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.5.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.11.1
      - name: Build and push wsProxy
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.18.0
        with:
          context: ./images/wsproxy
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/wsproxy:sha-${{ needs.detect-changes.outputs.ref }}
            ghcr.io/${{ github.repository_owner }}/wsproxy:stable

  update-gitops:
    needs: [detect-changes, publish-robrowser, publish-rathena, publish-wsproxy]
    if: always() && !cancelled() && (needs.publish-robrowser.result == 'success' || needs.publish-rathena.result == 'success' || needs.publish-wsproxy.result == 'success')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2
        with:
          ref: main

      - name: Set up Kustomize
        uses: imranismail/setup-kustomize@2ba527d4d055ab63514ba50a99456fc35684947f # v2.1.0

      - name: Update image tags in overlay
        run: |
          cd deploy/overlays/flux
          REF="${{ needs.detect-changes.outputs.ref }}"
          
          if [ "${{ needs.publish-rathena.result }}" = "success" ]; then
            kustomize edit set image ghcr.io/${{ github.repository_owner }}/rathena:sha-${REF}
          fi
          if [ "${{ needs.publish-robrowser.result }}" = "success" ]; then
            kustomize edit set image ghcr.io/${{ github.repository_owner }}/robrowser:sha-${REF}
          fi
          if [ "${{ needs.publish-wsproxy.result }}" = "success" ]; then
            kustomize edit set image ghcr.io/${{ github.repository_owner }}/wsproxy:sha-${REF}
          fi

      - name: Commit and push GitOps update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add deploy/overlays/flux/kustomization.yaml
          if git diff --staged --quiet; then
            echo "No image changes to commit."
          else
            git commit -m "chore(gitops): bump images to sha-${{ needs.detect-changes.outputs.ref }} [skip ci]"
            git push origin main
          fi
