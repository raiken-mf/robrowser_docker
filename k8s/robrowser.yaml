apiVersion: apps/v1
kind: Deployment
metadata:
  name: robrowser
  namespace: ${NAMESPACE}
  labels:
    app.kubernetes.io/name: robrowser
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: robrowser
  template:
    metadata:
      labels:
        app.kubernetes.io/name: robrowser
    spec:
      containers:
        - name: robrowser
          image: ghcr.io/raiken-mf/robrowser:2.0.5
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef:
                name: robrowser-config
          ports:
            - containerPort: 3000
              name: frontend
            - containerPort: 8080
              name: apache
          volumeMounts:
            - name: client-data
              mountPath: /opt/client_files
      volumes:
        - name: client-data
          persistentVolumeClaim:
            claimName: client-data
---
apiVersion: v1
kind: Service
metadata:
  name: robrowser
  namespace: ${NAMESPACE}
  labels:
    app.kubernetes.io/name: robrowser
spec:
  type: NodePort
  selector:
    app.kubernetes.io/name: robrowser
  ports:
    - name: frontend
      port: 3000
      targetPort: 3000
      nodePort: 30000
    - name: apache
      port: 8080
      targetPort: 8080
      nodePort: 30080
