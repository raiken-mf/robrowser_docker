name: CI

on:
  pull_request:
  push:
    branches: [main]
    paths-ignore:
      - 'clusters/**'
      - 'deploy/**'
      - 'scripts/**'
      - '.gitignore'
      - 'README.md'
      - 'docs/**'
      - '.github/workflows/**'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - name: Detect validation scope
        id: scope
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          changed=$(git diff --name-only "$BASE_SHA...$HEAD_SHA")
          printf 'Changed files:\n%s\n' "$changed"
          if grep -Eq '^(images/|build/|\.github/workflows/|deploy/|scripts/|Dockerfile$|\.dockerignore$)' <<< "$changed"; then
            echo 'relevant=true' >> "$GITHUB_OUTPUT"
          else
            echo 'relevant=false' >> "$GITHUB_OUTPUT"
          fi
      - name: Validate pinned source layouts
        if: steps.scope.outputs.relevant == 'true'
        run: chmod +x scripts/check-upstream-layout.sh && scripts/check-upstream-layout.sh
      - name: Validate Kustomize manifests
        if: steps.scope.outputs.relevant == 'true'
        run: kubectl kustomize deploy/overlays/flux >/dev/null
      - name: Validate Docker Compose configuration
        if: steps.scope.outputs.relevant == 'true'
        # The runner needs a non-secret example env file for Compose interpolation.
        run: |
          cp .env-tmpl .env
          set -a
          . .env
          . build/dependencies.env
          set +a
          docker compose -f deploy/compose/docker-compose-common.yml -f deploy/compose/docker-compose-rathena.yml config --quiet
          docker compose -f deploy/compose/docker-compose-common.yml -f deploy/compose/docker-compose-hercules.yml config --quiet
      - name: Build roBrowser image
        if: steps.scope.outputs.relevant == 'true'
        run: |
          set -a
          . build/dependencies.env
          set +a
          docker build \
            -f images/robrowser/Dockerfile \
            --build-arg ROBROWSER_REPOSITORY="$ROBROWSER_REPOSITORY" \
            --build-arg ROBROWSER_REF="$ROBROWSER_REF" \
            --build-arg REMOTECLIENT_REPOSITORY="$REMOTECLIENT_REPOSITORY" \
            --build-arg REMOTECLIENT_REF="$REMOTECLIENT_REF" \
            --build-arg ROENGLISH_REPOSITORY="$ROENGLISH_REPOSITORY" \
            --build-arg ROENGLISH_REF="$ROENGLISH_REF" \
            -t robrowser:ci .
      - name: Smoke-test roBrowser image
        if: steps.scope.outputs.relevant == 'true'
        shell: bash
        run: |
          docker run -d --name robrowser-ci \
            -e HOST=ro.example.test \
            -e PORT_HTTP=30080 \
            -e PORT_WSPROXY=30599 \
            -p 8080:8080 -p 3000:3000 robrowser:ci
          wait_for_http() {
            local url="$1"
            for i in $(seq 1 30); do
              if curl --fail --silent --show-error "$url" >/dev/null; then
                return 0
              fi
              sleep 2
            done
            echo "Timed out waiting for $url"
            return 1
          }
          wait_for_http http://127.0.0.1:8080/
          wait_for_http http://127.0.0.1:3000/
          curl --fail --silent --show-error http://127.0.0.1:8080/ -o /tmp/robrowser-index.html
          grep -Fq 'remoteClient:  "http://ro.example.test:30080/client/"' /tmp/robrowser-index.html
          grep -Fq 'address:     "ragnarok-login"' /tmp/robrowser-index.html
          grep -Fq 'socketProxy: "ws://ro.example.test:30599/"' /tmp/robrowser-index.html
          module_url='http://127.0.0.1:3000/src/Renderer/GR2/GR2ModelRenderer.js'
          for i in $(seq 1 30); do
            module_status=$(curl --silent --output /tmp/gr2-module.js --write-out '%{http_code}' "$module_url" || true)
            if [ "$module_status" = '200' ] && grep -q 'granny-ro-js_wasm' /tmp/gr2-module.js; then
              break
            fi
            sleep 2
          done
          test "$module_status" = '200' || { echo "GR2 module request returned HTTP $module_status" >&2; cat /tmp/gr2-module.js; exit 1; }
          module=$(cat /tmp/gr2-module.js)
          grep -q 'granny-ro-js_wasm' <<< "$module"
          grep -q 'parseAnimated' <<< "$module"
          grep -q 'poseAt' <<< "$module"
          if grep -q 'Failed to resolve import' <<< "$module"; then
            echo 'Vite returned an unresolved-import overlay for the GR2 renderer.' >&2
            exit 1
          fi
      - name: Show roBrowser container diagnostics
        if: always() && steps.scope.outputs.relevant == 'true'
        run: |
          docker ps -a --filter name=robrowser-ci
          docker inspect robrowser-ci --format 'status={{.State.Status}} exit={{.State.ExitCode}} error={{.State.Error}}' || true
          docker logs robrowser-ci || true
      - name: Remove roBrowser smoke-test container
        if: always() && steps.scope.outputs.relevant == 'true'
        run: docker rm -f robrowser-ci || true
      - name: Build rAthena image
        if: steps.scope.outputs.relevant == 'true'
        run: |
          set -a
          . build/dependencies.env
          set +a
          docker build \
            --build-arg RATHENA_REPOSITORY="$RATHENA_REPOSITORY" \
            --build-arg RATHENA_REF="$RATHENA_REF" \
            -t rathena:ci ./images/rathena
      - name: Build wsProxy image
        if: steps.scope.outputs.relevant == 'true'
        run: docker build -t wsproxy:ci ./images/wsproxy
      - name: Smoke-test wsProxy image
        if: steps.scope.outputs.relevant == 'true'
        shell: bash
        run: |
          docker run -d --name wsproxy-ci -p 5999:5999 wsproxy:ci -a ragnarok-login:6900
          for i in $(seq 1 15); do
            if docker ps --filter name=wsproxy-ci --filter status=running --format '{{.ID}}' | grep -q .; then
              break
            fi
            sleep 1
          done
          test -n "$(docker ps --filter name=wsproxy-ci --filter status=running --format '{{.ID}}')"
          docker exec -i wsproxy-ci node - <<'NODE'
          const WebSocket = require('/opt/wsproxy/node_modules/ws');
          const socket = new WebSocket('ws://127.0.0.1:5999/ragnarok-login:6900');
          const timeout = setTimeout(() => { console.error('WebSocket handshake timeout'); process.exit(1); }, 10000);
          socket.on('open', () => {
            clearTimeout(timeout);
            socket.close();
            setTimeout(() => process.exit(0), 100);
          });
          socket.on('error', (error) => { clearTimeout(timeout); console.error(error); process.exit(1); });
          NODE
      - name: Show wsProxy diagnostics
        if: always() && steps.scope.outputs.relevant == 'true'
        run: |
          docker ps -a --filter name=wsproxy-ci
          docker logs wsproxy-ci || true
      - name: Remove wsProxy smoke-test container
        if: always() && steps.scope.outputs.relevant == 'true'
        run: docker rm -f wsproxy-ci || true
