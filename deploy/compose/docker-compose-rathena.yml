x-game-environment: &game-environment
  MARIADB_HOST: ${MARIADB_HOST:-database}
  MARIADB_DATABASE: ${MARIADB_DATABASE:-ragnarok}
  MARIADB_USER: ${MARIADB_USER:-ragnarok}
  MARIADB_PASSWORD: ${MARIADB_PASSWORD:-}
  SET_INTERSRV_USER: ${SET_INTERSRV_USER:-s1}
  SET_INTERSRV_PASSWORD: ${SET_INTERSRV_PASSWORD:-}
  SET_MOTD: ${SET_MOTD:-Welcome}
  SET_PRERENEWAL: ${SET_PRERENEWAL:-0}
  LOGIN_SERVER_HOST: ${LOGIN_SERVER_HOST:-ragnarok-login}
  CHAR_SERVER_HOST: ${CHAR_SERVER_HOST:-ragnarok-char}
  MAP_SERVER_HOST: ${MAP_SERVER_HOST:-ragnarok-map}
  SET_PINCODE_ENABLED: ${SET_PINCODE_ENABLED:-no}
  SET_NEW_ACCOUNT: ${SET_NEW_ACCOUNT:-yes}

services:
  rathena:
    container_name: "rathena"
    image: rathena
    pull_policy: never
    volumes:
      - ../../images/rathena/repository_override:/opt/repository_override
    build:
      context: ../../images/rathena
      args:
          PACKETVER: ${PACKETVER}
          SET_PRERENEWAL: ${SET_PRERENEWAL}
          RATHENA_REPOSITORY: ${RATHENA_REPOSITORY:-https://github.com/raiken-mf/rathena.git}
          RATHENA_REF: ${RATHENA_REF:-d4b8e7b8f16061cc2496d377ac8f777ce72a4f39}
          PACKET_OBFUSCATION_KEY1: ${PACKET_OBFUSCATION_KEY1}
          PACKET_OBFUSCATION_KEY2: ${PACKET_OBFUSCATION_KEY2}
          PACKET_OBFUSCATION_KEY3: ${PACKET_OBFUSCATION_KEY3}
    environment:
      <<: *game-environment
      INIT_DB: "true"
    command: ["true"]
    depends_on:
      database:
        condition: service_healthy
    networks:
      - backend

  ragnarok-login:
    container_name: "ragnarok-login"
    image: rathena
    restart: always
    pull_policy: never
    user: ragnarok:ragnarok
    environment:
      <<: *game-environment
      INIT_DB: "false"
    #volumes:
    #  - ../../images/rathena/repository:/opt/ragnarok
    command: /opt/ragnarok/login-server
    tty: true
    depends_on:
      rathena:
        condition: service_completed_successfully
    ports:
      - 6900:6900
    networks:
      - backend

  ragnarok-char:
    container_name: "ragnarok-char"
    image: rathena
    restart: always
    pull_policy: never
    user: ragnarok:ragnarok
    environment:
      <<: *game-environment
      INIT_DB: "false"
    #volumes:
    #  - ../../images/rathena/repository:/opt/ragnarok
    command: /opt/ragnarok/char-server
    tty: true
    depends_on:
      ragnarok-login:
        condition: service_started
    ports:
      - 6121:6121
    networks:
      - backend

  ragnarok-map:
    container_name: "ragnarok-map"
    image: rathena
    restart: always
    pull_policy: never
    user: ragnarok:ragnarok
    environment:
      <<: *game-environment
      INIT_DB: "false"
    #volumes:
    #  - ../../images/rathena/repository:/opt/ragnarok
    command: /opt/ragnarok/map-server
    tty: true
    depends_on:
      ragnarok-char:
        condition: service_started
    ports:
      - 5121:5121
    networks:
      - backend

networks:
  backend:
