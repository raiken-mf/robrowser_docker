name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate pinned source layouts
        run: chmod +x scripts/check-upstream-layout.sh && scripts/check-upstream-layout.sh
      - name: Validate Docker Compose configuration
        run: |
          set -a
          . .github/dependencies.env
          set +a
          docker compose -f docker-compose-common.yml -f docker-compose-rathena.yml config --quiet
          docker compose -f docker-compose-common.yml -f docker-compose-hercules.yml config --quiet
      - name: Build roBrowser image
        run: |
          set -a
          . .github/dependencies.env
          set +a
          docker build \
            -f robrowser/Dockerfile \
            --build-arg ROBROWSER_REPOSITORY="$ROBROWSER_REPOSITORY" \
            --build-arg ROBROWSER_REF="$ROBROWSER_REF" \
            --build-arg ROENGLISH_REPOSITORY="$ROENGLISH_REPOSITORY" \
            --build-arg ROENGLISH_REF="$ROENGLISH_REF" \
            -t robrowser:ci .
      - name: Smoke-test roBrowser image
        run: |
          docker run -d --name robrowser-ci -p 8080:8080 -p 3000:3000 robrowser:ci
          for i in $(seq 1 30); do
            curl --fail --silent --show-error http://127.0.0.1:8080/ >/dev/null && break
            sleep 2
          done
          curl --fail --silent --show-error http://127.0.0.1:8080/ >/dev/null
          curl --fail --silent --show-error http://127.0.0.1:3000/ >/dev/null
      - name: Build rAthena image
        run: |
          set -a
          . .github/dependencies.env
          set +a
          docker build \
            --build-arg RATHENA_REPOSITORY="$RATHENA_REPOSITORY" \
            --build-arg RATHENA_REF="$RATHENA_REF" \
            -t rathena:ci ./rathena
      - name: Build Hercules image
        run: |
          set -a
          . .github/dependencies.env
          set +a
          docker build \
            --build-arg HERCULES_REPOSITORY="$HERCULES_REPOSITORY" \
            --build-arg HERCULES_REF="$HERCULES_REF" \
            --build-arg PACKETVER=20211103 \
            --build-arg SET_PRERENEWAL=0 \
            --build-arg PACKET_OBFUSCATION_KEY1=0x1 \
            --build-arg PACKET_OBFUSCATION_KEY2=0x2 \
            --build-arg PACKET_OBFUSCATION_KEY3=0x3 \
            --build-arg MARIADB_HOST=database \
            --build-arg MARIADB_DATABASE=ragnarok \
            --build-arg MARIADB_USER=ragnarok \
            --build-arg MARIADB_PASSWORD=ci-only-password \
            --build-arg SET_INTERSRV_USER=ci \
            --build-arg SET_INTERSRV_PASSWORD=ci-only-password \
            --build-arg SET_MOTD=CI \
            -t hercules:ci ./hercules
