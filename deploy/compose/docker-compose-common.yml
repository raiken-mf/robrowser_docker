services:
  database:
    container_name: "database"
    image: mariadb:11.8.6
    restart: always
    env_file: ../../.env
    #ports:
    #  - 3306:3306
    volumes:
      # Uncomment line below to use on volume
      #- ./database/data:/var/lib/mysql
      - ../../database/conf.d:/etc/mariadb.conf.d:ro
    healthcheck:
      test: ["CMD-SHELL", "mariadb --user=$${MARIADB_USER} --password=$${MARIADB_PASSWORD} --execute 'SELECT 1;'"]
      start_period: 10s
      start_interval: 10s
      interval: 10s
      timeout: 5s
      retries: 3
    networks:
      - backend

  wsproxy:
    container_name: "wsproxy"
    image: ghcr.io/raiken-mf/wsproxy:${WSPROXY_IMAGE_TAG:-stable}
    restart: always
    command: ["-a", "ragnarok-login:6900,ragnarok-char:6121,ragnarok-map:5121"]
    tty: true
    ports:
      - "${PORT_WSPROXY:-5999}:5999"
    networks:
      - backend

  robrowser:
    container_name: "robrowser"
    image: ghcr.io/raiken-mf/robrowser:${ROBROWSER_IMAGE_TAG:-stable}
    pull_policy: always
    restart: always
    env_file: ../../.env
    volumes:
      - ../../client/AI:/opt/client_files/AI:ro
      - ../../client/BGM:/opt/client_files/BGM:ro
      - ../../client/data:/opt/client_files/data:ro
      - ../../client/System:/opt/client_files/System:ro
      - ../../client/resources:/opt/client_files/resources:ro
    build:
      context: ../..
      dockerfile: images/robrowser/Dockerfile
      args:
        SET_PRERENEWAL: ${SET_PRERENEWAL}
        REMOTECLIENT_REPOSITORY: ${REMOTECLIENT_REPOSITORY:-https://github.com/raiken-mf/roBrowserLegacy-RemoteClient-PHP.git}
        REMOTECLIENT_REF: ${REMOTECLIENT_REF:-fe7c14dceb62a761f4319abe9738b70b52559078}
        ROENGLISH_REPOSITORY: ${ROENGLISH_REPOSITORY:-https://github.com/raiken-mf/ROenglishRE.git}
        ROENGLISH_REF: ${ROENGLISH_REF:-680a2f2126c8eb5872bf06cf441685c408ed1358}
    tty: true
    depends_on:
      - wsproxy
    environment:
      ROBROWSER_ROLE: web
    ports:
      - "${PORT_HTTP:-8080}:8080"
    networks:
      - backend
      - frontend

  vite:
    container_name: "vite"
    image: ghcr.io/raiken-mf/vite:${VITE_IMAGE_TAG:-stable}
    pull_policy: always
    build:
      context: ../..
      dockerfile: images/vite/Dockerfile
      args:
        ROBROWSER_REPOSITORY: ${ROBROWSER_REPOSITORY:-https://github.com/raiken-mf/roBrowserLegacy.git}
        ROBROWSER_REF: ${ROBROWSER_REF:-7181f0f54f9785829839bb15459822ac511c58ab}
    restart: always
    env_file: ../../.env
    environment:
      ROBROWSER_ROLE: vite
      PORT_FRONTEND: ${PORT_FRONTEND:-3000}
    ports:
      - "${PORT_FRONTEND:-3000}:3000"
    networks:
      - frontend

networks:
  backend:
  frontend:
