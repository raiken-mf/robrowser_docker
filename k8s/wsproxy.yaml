apiVersion: apps/v1
kind: Deployment
metadata:
  name: wsproxy
  namespace: ${NAMESPACE}
  labels:
    app.kubernetes.io/name: wsproxy
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: wsproxy
  template:
    metadata:
      labels:
        app.kubernetes.io/name: wsproxy
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: wsproxy
          image: ghcr.io/raiken-mf/wsproxy:${WSPROXY_IMAGE_TAG}
          # stable intentionally follows the current main image on each rollout.
          imagePullPolicy: Always
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          env:
            - name: PORT
              value: "5999"
            - name: RAG_LOGIN_HOST
              value: "ragnarok-login"
            - name: RAG_LOGIN_PORT
              value: "6900"
            - name: RAG_CHAR_HOST
              value: "ragnarok-char"
            - name: RAG_CHAR_PORT
              value: "6121"
            - name: RAG_MAP_HOST
              value: "ragnarok-map"
            - name: RAG_MAP_PORT
              value: "5121"
          ports:
            - containerPort: 5999
              name: wsproxy
          readinessProbe:
            tcpSocket:
              port: wsproxy
            initialDelaySeconds: 2
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 6
          livenessProbe:
            tcpSocket:
              port: wsproxy
            initialDelaySeconds: 10
            periodSeconds: 15
            timeoutSeconds: 2
            failureThreshold: 3
          resources:
            requests:
              cpu: 25m
              memory: 32Mi
            limits:
              cpu: 250m
              memory: 128Mi
---
apiVersion: v1
kind: Service
metadata:
  name: wsproxy
  namespace: ${NAMESPACE}
  labels:
    app.kubernetes.io/name: wsproxy
spec:
  type: NodePort
  selector:
    app.kubernetes.io/name: wsproxy
  ports:
    - name: wsproxy
      port: 5999
      targetPort: 5999
      nodePort: ${PORT_WSPROXY:-30599}
