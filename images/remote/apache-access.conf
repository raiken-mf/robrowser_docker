# Standard Apache access controls for the unmodified RemoteClient.  Apache
# serves public assets normally; PHP continues to handle upstream 404s.
<Directory "/var/www/localhost/htdocs/remote">
    Options -Indexes
    <FilesMatch "(?i)\.php$">
        Require all denied
    </FilesMatch>
    <Files "index.php">
        Require all granted
    </Files>
</Directory>
<LocationMatch "(?i)^/remote/(resources|cache|logs|tools)(/|$)">
    Require all denied
</LocationMatch>
# Reject raw traversal or repeated encoding before Apache normalizes the URL.
RewriteEngine On
RewriteCond %{THE_REQUEST} "\s[^\s?]*(\.\.|%2e|%2f|%5c|%25)" [NC]
RewriteRule ^ - [F,L]

# The shipped GRF stores this browser-requested file under data/ai. A real
# loose AI/Util.lua always wins; the existing PHP handler reads the GRF.
RewriteCond %{DOCUMENT_ROOT}/remote/AI/Util.lua !-f
RewriteRule ^/remote/AI/Util\.lua$ /remote/data/ai/util.lua [R=302,L,NC]
