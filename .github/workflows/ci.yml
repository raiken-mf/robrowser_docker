name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Validate pinned source layouts
        run: chmod +x scripts/check-upstream-layout.sh && scripts/check-upstream-layout.sh
      - name: Validate Docker Compose configuration
        # The runner needs a non-secret example env file for Compose interpolation.
        run: |
          cp .env-tmpl .env
          set -a
          . .env
          . .github/dependencies.env
          set +a
          docker compose -f docker-compose-common.yml -f docker-compose-rathena.yml config --quiet
          docker compose -f docker-compose-common.yml -f docker-compose-hercules.yml config --quiet
      - name: Build roBrowser image
        run: |
          set -a
          . .github/dependencies.env
          set +a
          docker build \
            -f robrowser/Dockerfile \
            --build-arg ROBROWSER_REPOSITORY="$ROBROWSER_REPOSITORY" \
            --build-arg ROBROWSER_REF="$ROBROWSER_REF" \
            --build-arg ROENGLISH_REPOSITORY="$ROENGLISH_REPOSITORY" \
            --build-arg ROENGLISH_REF="$ROENGLISH_REF" \
            -t robrowser:ci .
      - name: Smoke-test roBrowser image
        shell: bash
        run: |
          docker run -d --name robrowser-ci -p 8080:8080 -p 3000:3000 robrowser:ci
          for i in $(seq 1 30); do
            if curl --fail --silent --show-error http://127.0.0.1:8080/ >/dev/null; then
              break
            fi
            sleep 2
          done
          curl --fail --silent --show-error http://127.0.0.1:8080/ >/dev/null
          curl --fail --silent --show-error http://127.0.0.1:3000/ >/dev/null
      - name: Show roBrowser container diagnostics
        if: always()
        run: |
          docker ps -a --filter name=robrowser-ci
          docker inspect robrowser-ci --format 'status={{.State.Status}} exit={{.State.ExitCode}} error={{.State.Error}}' || true
          docker logs robrowser-ci || true
      - name: Remove roBrowser smoke-test container
        if: always()
        run: docker rm -f robrowser-ci || true
      - name: Build rAthena image
        run: |
          set -a
          . .github/dependencies.env
          set +a
          docker build \
            --build-arg RATHENA_REPOSITORY="$RATHENA_REPOSITORY" \
            --build-arg RATHENA_REF="$RATHENA_REF" \
            -t rathena:ci ./rathena
